version: '3.8'

services:
  postgres:
    container_name: generic-e-comerce-pg
    image: postgres
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: generic-e-comerce-pg
      PGDATA: /data/postgres
    volumes:
      - ./data/pg:/data/postgres

  cache:
    container_name: cache
    image: redis
    ports:
      - 6379:6379
    volumes:
      - ./data/redis:/data

  message-broker:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"     # Porta para conexão com apps (AMQP)
      - "15672:15672"   # Porta da interface web
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest