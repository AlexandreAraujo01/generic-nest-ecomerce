name: Run Unit Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: public
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: docker
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: |
          mkdir -p src/infra/auth
          echo "export const jwtConstants = { secret: 'test-secret-constant' };" > src/infra/auth/constants.ts
          pnpm test:all
        env:
          DATABASE_URL: postgres://postgres:docker@localhost:5433/public
